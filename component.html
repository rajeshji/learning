<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Component Scalability Deep Dive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family:system-ui,-apple-system,sans-serif; }

    .sc-tag { display:inline-block; font-size:.68rem; font-weight:700; border-radius:999px; padding:.2em .65em; background:#fee2e2; color:#991b1b; }
    .issue-li { font-size:.85rem; color:#374151; line-height:1.8; }

    .scale-col { border-radius:.75rem; padding:.85rem 1rem; font-size:.78rem; line-height:1.6; }
    .scale-x10   { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; }
    .scale-x100  { background:#fffbeb; border:1px solid #fde68a; color:#92400e; }
    .scale-x1000 { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
    .scale-head  { font-size:.65rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; margin-bottom:.4rem; }

    .dd-step { border-left:3px solid #10b981; padding:.35rem 0 .35rem .65rem; margin-bottom:.55rem; }
    .dd-head { font-size:.62rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#059669; margin-bottom:.15rem; }
    .dd-text { font-size:.8rem; color:#374151; line-height:1.6; }
    .dd-fail { background:#fef2f2; border-left-color:#ef4444; }
    .dd-fail .dd-head { color:#dc2626; }
    .dd-list { list-style:disc; padding-left:1.1rem; margin:0; }
    .dd-list li { font-size:.78rem; color:#374151; line-height:1.65; }
    .dd-chip { display:inline-block; font-size:.68rem; font-weight:600; background:#ecfdf5; color:#065f46;
               border:1px solid #a7f3d0; border-radius:999px; padding:.15em .6em; margin:.15em .3em .15em 0; }

    /* interview prep section */
    .iv-pattern { list-style:disc; padding-left:1.1rem; margin:0; }
    .iv-pattern li { font-size:.82rem; color:#374151; line-height:1.75; }
    .iv-diagram { background:#0f172a; color:#a7f3d0; font-family:'Courier New',monospace; font-size:.72rem;
                  border-radius:.75rem; padding:1rem 1.25rem; white-space:pre; overflow-x:auto; line-height:1.5; }
    .iv-qa { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:.9rem; padding:.9rem 1.1rem; margin-bottom:.7rem; }
    .iv-q { font-size:.62rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#059669; margin-bottom:.35rem; }
    .iv-q-text { font-size:.85rem; font-weight:700; color:#1f2937; margin-bottom:.5rem; }
    .iv-a { font-size:.82rem; color:#374151; line-height:1.65; }
    .iv-principal { background:#1c1917; border:1px solid #ca8a04; border-radius:.9rem; padding:1rem 1.25rem; }
    .iv-principal-head { font-size:.62rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#fbbf24; margin-bottom:.4rem; }
    .iv-principal-text { font-size:.85rem; color:#fef3c7; line-height:1.65; font-style:italic; }
    .iv-example { background:#fffbeb; border:1px solid #fde68a; border-radius:.9rem; padding:1rem 1.25rem; margin-bottom:1rem; }
    .iv-example-head { font-size:.62rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#b45309; margin-bottom:.4rem; }
    .iv-example-text { font-size:.83rem; color:#78350f; line-height:1.7; }
    .bn-example { background:#fffbeb; border:1px solid #fde68a; border-radius:.6rem; padding:.7rem .9rem; margin-top:.75rem; font-size:.76rem; color:#78350f; line-height:1.6; }
    .bn-example b { color:#b45309; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- STICKY HEADER -->
<header class="sticky top-0 z-30 bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-5xl mx-auto px-5 py-3 flex items-center gap-2 text-sm flex-wrap">
    <a href="scalability.html"
       class="flex items-center gap-1.5 text-emerald-600 hover:text-emerald-800 font-semibold
              bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg transition-colors shrink-0">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>Back
    </a>
    <svg class="w-3.5 h-3.5 text-gray-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    <a href="index.html" class="text-gray-400 hover:text-gray-600">Dashboard</a>
    <svg class="w-3.5 h-3.5 text-gray-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    <a href="scalability.html" class="text-gray-400 hover:text-gray-600">Scalability</a>
    <svg class="w-3.5 h-3.5 text-gray-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    <span id="crumb-name" class="text-emerald-700 font-semibold">Component</span>
  </div>
</header>

<div id="page-content" class="max-w-5xl mx-auto px-5 pt-8 pb-16"></div>

<script src="scalability-data.js"></script>
<script src="scalability-interview-data.js"></script>
<script src="scalability-examples-data.js"></script>
<script>
  function getSlug() {
    return new URLSearchParams(window.location.search).get("c") || "";
  }
  function slugify(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  }
  function chips(list) {
    return list.map(x => `<span class="dd-chip">${x}</span>`).join("");
  }
  function tradeoffList(list) {
    return `<ul class="dd-list">${list.map(t => `<li>${t}</li>`).join("")}</ul>`;
  }
  function issuesList(list) {
    return `<ul class="list-disc pl-5 space-y-1">${list.map(i => `<li class="issue-li">${i}</li>`).join("")}</ul>`;
  }
  function bottleneckCard(b, i, example) {
    return `
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 mb-4">
        <p class="font-bold text-gray-800 text-sm mb-3">${i + 1}. ${b.title}</p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="scale-col scale-x10"><p class="scale-head">At 10&times; load</p>${b.x10}</div>
          <div class="scale-col scale-x100"><p class="scale-head">At 100&times; load</p>${b.x100}</div>
          <div class="scale-col scale-x1000"><p class="scale-head">At 1000&times; load</p>${b.x1000}</div>
        </div>
        ${example ? `<div class="bn-example"><b>Example:</b> ${example}</div>` : ""}
      </div>`;
  }
  function renderDeepDive(d, example) {
    if (!d) return "";
    return `
      <div class="dd-step">
        <p class="dd-head">Capacity</p>
        <p class="dd-text">${d.capacity}</p>
      </div>
      <div class="dd-step">
        <p class="dd-head">Bottleneck</p>
        <p class="dd-text">${d.bottleneck}</p>
      </div>
      <div class="dd-step">
        <p class="dd-head">Scaling pattern</p>
        <p class="dd-text">${d.scaling}</p>
      </div>
      <div class="dd-step dd-fail">
        <p class="dd-head">Failure under scale</p>
        <p class="dd-text">${d.failureUnderScale}</p>
      </div>
      <div class="dd-step">
        <p class="dd-head">Trade-offs</p>
        ${tradeoffList(d.tradeoffs)}
      </div>
      <div class="dd-step">
        <p class="dd-head">Metrics to watch</p>
        <div>${chips(d.metrics)}</div>
      </div>
      ${example ? `<div class="bn-example"><b>Example:</b> ${example}</div>` : ""}
    `;
  }

  function patternList(list) {
    return `<ul class="iv-pattern">${list.map(p => `<li>${p}</li>`).join("")}</ul>`;
  }
  function qaBlock(qa) {
    return qa.map(item => `
      <div class="iv-qa">
        <p class="iv-q">Follow-up</p>
        <p class="iv-q-text">&ldquo;${item.q}&rdquo;</p>
        <p class="iv-a">${item.a}</p>
      </div>`).join("");
  }
  function renderInterview(slug) {
    const iv = (typeof INTERVIEW !== "undefined") ? INTERVIEW[slug] : null;
    if (!iv) {
      return `
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 mt-6">
          <p class="font-bold text-gray-800 text-sm mb-2">Interview prep</p>
          <p class="text-xs text-gray-400 italic">No interview notes documented yet for this component.</p>
        </div>`;
    }
    return `
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 mt-6">
        <p class="font-bold text-gray-800 text-sm mb-2">Interview prep</p>
        <p class="text-sm text-gray-600 leading-relaxed mb-4">${iv.overview}</p>

        ${(iv.patterns && iv.patterns.length) ? `
          <p class="dd-head mb-2">Scaling patterns</p>
          ${patternList(iv.patterns)}
        ` : ""}

        ${iv.example ? `
          <div class="iv-example mt-4">
            <p class="iv-example-head">Worked example</p>
            <p class="iv-example-text">${iv.example}</p>
          </div>
        ` : ""}

        ${iv.diagram ? `
          <p class="dd-head mt-4 mb-2">Diagram</p>
          <pre class="iv-diagram">${iv.diagram}</pre>
        ` : ""}

        ${(iv.qa && iv.qa.length) ? `
          <p class="dd-head mt-4 mb-2">Interview Q&amp;A</p>
          ${qaBlock(iv.qa)}
        ` : ""}

        ${iv.principal ? `
          <div class="iv-principal mt-2">
            <p class="iv-principal-head">Principal-level insight</p>
            <p class="iv-principal-text">&ldquo;${iv.principal}&rdquo;</p>
          </div>
        ` : ""}
      </div>`;
  }

  function render() {
    const slug = getSlug();
    const c = COMPONENTS.find(x => slugify(x.name) === slug);
    const content = document.getElementById("page-content");

    if (!c) {
      content.innerHTML = `
        <p class="text-gray-500 text-sm">Component not found. <a href="scalability.html" class="text-emerald-600 font-semibold">Back to Scalability</a>.</p>`;
      return;
    }

    document.title = `${c.name} — Scalability Deep Dive`;
    document.getElementById("crumb-name").textContent = c.name;

    const sc = c.scale || { issues: [], bottlenecks: [] };
    const ex = (typeof EXAMPLES !== "undefined") ? EXAMPLES[slug] : null;

    content.innerHTML = `
      <div class="flex items-center gap-3 mb-1">
        <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center shrink-0">
          <span class="font-black text-emerald-700 text-sm">${c.name.slice(0,2).toUpperCase()}</span>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-800">${c.name}</h1>
          <p class="text-xs text-gray-400 mt-0.5">Scalability issues, bottlenecks, and how to resolve them at 10&times;, 100&times;, and 1000&times; load</p>
        </div>
        <span class="ml-auto sc-tag">${c.failure}</span>
      </div>

      <!-- INTERVIEW PREP -->
      ${renderInterview(slug)}

      <!-- SCALABILITY ISSUES -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 mt-6">
        <p class="font-bold text-gray-800 text-sm mb-3">Scalability issues with ${c.name}</p>
        ${issuesList(sc.issues && sc.issues.length ? sc.issues : ["No issues documented yet."])}
      </div>

      <!-- BOTTLENECKS AT SCALE -->
      <p class="font-bold text-gray-800 text-sm mt-8 mb-3">Bottlenecks &amp; how to resolve them as load grows</p>
      ${(sc.bottlenecks && sc.bottlenecks.length) ? sc.bottlenecks.map((b, i) => bottleneckCard(b, i, ex && ex.bottlenecks ? ex.bottlenecks[i] : null)).join("") : `<p class="text-xs text-gray-400 italic">No bottleneck breakdown documented yet.</p>`}

      <!-- FULL DEEP DIVE (capacity/bottleneck/scaling/failure/tradeoffs/metrics) -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 mt-8">
        <p class="font-bold text-gray-800 text-sm mb-3">Full breakdown</p>
        ${renderDeepDive(c.deep, ex ? ex.deep : null)}
      </div>
    `;
  }

  render();
</script>
</body>
</html>
